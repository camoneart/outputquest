# Dependabot は依存更新の PR(提案)を自動生成するのみ。
# 実際のバージョン変更はレビュー+マージ(人間判断)で確定 = CLAUDE.md「承認フロー必要」を満たす。
# auto-merge は意図的に設定しない(全 PR を人間レビュー必須に保つ)。
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    # 以下 2 件は major 更新のみ無視する(minor/patch は従来どおり受け取る)。
    # どちらも上流が未対応であることが原因で、本リポジトリ側の修正では解決しない。
    #
    # eslint: eslint-config-next が引き込む eslint-plugin-react が ESLint 10 に未対応で、
    #   10.x へ上げると `pnpm lint` が TypeError でクラッシュする (PR #232 で 9.39.5 へ戻した)。
    #   eslint-plugin-react の ESLint 10 対応版 (7.8.0) が安定リリースされたら見直す。
    #
    # typescript: eslint-config-next/typescript が引き込む @typescript-eslint が
    #   TypeScript 7 に未対応。peerDependencies が `>=4.8.4 <6.1.0` で、latest (8.66.0) でも
    #   同じ範囲のまま 9.x は未リリース。7.0.2 へ上げると typescript-estree の初期化時に
    #   `TypeError: Cannot read properties of undefined (reading 'Cjs')` でクラッシュする。
    #   @typescript-eslint が TypeScript 7 に対応したら見直す (issue #244)。
    ignore:
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"
          - "babel-plugin-react-compiler"
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
          - "@google/generative-ai"
      clerk-auth:
        patterns:
          - "@clerk/*"
          - "svix"
      prisma-db:
        patterns:
          - "prisma"
          - "@prisma/*"
          - "pg"
          - "@types/pg"
      ui:
        patterns:
          - "@phosphor-icons/*"
          - "@radix-ui/*"
          - "lucide-react"
          - "react-icons"
          - "motion"
          - "class-variance-authority"
          - "clsx"
          - "tailwind-merge"
          - "tailwindcss-animate"
      styling:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "postcss"
      dev-tooling:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "prettier*"
          - "typescript"
          - "@types/node"
          - "@types/howler"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
